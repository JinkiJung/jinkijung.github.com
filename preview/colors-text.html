<!DOCTYPE html><html><head><meta charset="utf-8"><title>Text colors</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:12px;">
  <div style="display:flex;align-items:center;gap:16px;">
    <div style="width:48px;height:48px;background:#171717;border-radius:8px;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div style="font-family:var(--font-sans);font-size:20px;font-weight:600;letter-spacing:-0.6px;color:#171717;">Ink — primary text and CTA fill.</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);margin-top:2px;">colors.ink · #171717</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div style="width:48px;height:48px;background:#4d4d4d;border-radius:8px;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div style="font-family:var(--font-sans);font-size:16px;font-weight:400;color:#4d4d4d;">Body — sub-headings, captions, nav inactive.</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);margin-top:2px;">colors.body · #4d4d4d</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div style="width:48px;height:48px;background:#888888;border-radius:8px;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div style="font-family:var(--font-sans);font-size:14px;font-weight:400;color:#888888;">Mute — placeholder, fine print, low-key labels.</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);margin-top:2px;">colors.mute · #888888</div>
    </div>
  </div>
</div>
</body></html>
