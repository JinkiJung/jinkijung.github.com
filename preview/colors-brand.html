<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brand color</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;gap:24px;align-items:stretch;">
  <div style="width:260px;height:200px;background:#171717;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:20px;">
    <div style="font-family:var(--font-mono);font-size:11px;color:#a1a1a1;text-transform:uppercase;letter-spacing:0.04em;">primary · ink</div>
    <div>
      <div style="font-family:var(--font-sans);font-weight:600;font-size:32px;letter-spacing:-1.28px;color:#fff;line-height:1;">#171717</div>
      <div style="font-family:var(--font-sans);font-size:13px;color:#a1a1a1;margin-top:6px;">colors.primary · colors.ink</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;">
    <div style="font-family:var(--font-sans);font-weight:600;font-size:20px;letter-spacing:-0.6px;color:var(--color-ink);">The single primary.</div>
    <div style="font-family:var(--font-sans);font-size:14px;line-height:22px;color:var(--color-body);max-width:380px;">Black-near-pure ink. Carries every CTA, every body paragraph on light surfaces, and the polarity-flipped dark band. The brand never introduces a second primary.</div>
  </div>
</div>
</body></html>
