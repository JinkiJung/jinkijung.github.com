<!DOCTYPE html><html><head><meta charset="utf-8"><title>Body & label scale</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:12px;">
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:18px;font-weight:400;line-height:28px;color:#171717;flex:1;">The lead paragraph that sits below a section headline.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);white-space:nowrap;">body-lg · 18/400</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:16px;font-weight:400;line-height:24px;color:#171717;flex:1;">Default body paragraph — the workhorse.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);white-space:nowrap;">body-md · 16/400</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:14px;font-weight:400;line-height:20px;letter-spacing:-0.28px;color:#171717;flex:1;">Secondary body, nav-link text, button-md labels.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);white-space:nowrap;">body-sm · 14/400</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:12px;font-weight:400;line-height:16px;color:#171717;flex:1;">Footer secondary lines, badge labels, fine print.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);white-space:nowrap;">caption · 12/400</div>
  </div>
</div>
</body></html>
