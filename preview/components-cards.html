<!DOCTYPE html><html><head><meta charset="utf-8"><title>Card chrome</title><link rel="stylesheet" href="_base.css"></head>

<div style="padding:24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;background:#fafafa;">

    <div style="font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:-0.6px;color:#171717;">Web Apps</div>

    <div style="font-family:var(--font-mono);font-size:11px;color:#888;margin-top:14px;">card-marketing · 8 · elev-3</div>
  </div>
  <div style="background:#fff;border-radius:12px;padding:24px;box-shadow:0px 2px 2px rgba(0,0,0,0.04), 0px 8px 16px -4px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.08);">

    <div style="font-family:var(--font-sans);font-size:13px;line-height:19px;color:#4d4d4d;margin-top:6px;">Stream from any model with one endpoint.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#888;margin-top:14px;">card-marketing-large · 12 · elev-4</div>
  </div>
  <div style="background:#fafafa;border-radius:8px;padding:20px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);">
    <div style="font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:-0.6px;color:#171717;">Edge</div>
    <div style="font-family:var(--font-sans);font-size:13px;line-height:19px;color:#4d4d4d;margin-top:6px;">Functions at the edge, by default.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#888;margin-top:14px;">card-soft · canvas-soft fill</div>
  </div>
