<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:10px;">
  <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-mute);">4px base · every value is a multiple of 4</div>
  <div style="display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--color-ink);">
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">xxs · 4</div><div style="height:14px;width:4px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">xs · 8</div><div style="height:14px;width:8px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">sm · 12</div><div style="height:14px;width:12px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">md · 16</div><div style="height:14px;width:16px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">lg · 24</div><div style="height:14px;width:24px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">xl · 32</div><div style="height:14px;width:32px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">2xl · 40</div><div style="height:14px;width:40px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">3xl · 48</div><div style="height:14px;width:48px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">4xl · 64</div><div style="height:14px;width:64px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">5xl · 96</div><div style="height:14px;width:96px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">6xl · 128</div><div style="height:14px;width:128px;background:#171717;border-radius:2px;"></div></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:60px;color:var(--color-mute);">section · 192</div><div style="height:14px;width:192px;background:#171717;border-radius:2px;"></div></div>
  </div>
</div>
</body></html>
