name: Deploy dev and v2025 to Pages

on:
  push:
    branches: [dev, v2025]
  workflow_dispatch:

permissions:
  contents: read

# Both branches publish the same complete site; never race independent deploys.
concurrency:
  group: combined-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/v2025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: current
      - uses: actions/checkout@v4
        with:
          ref: v2025
          path: archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            current/package-lock.json
            archive/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build current homepage
        working-directory: current
        run: npm ci && npm run build
      - name: Build 2025 archive
        working-directory: archive
        env:
          BASE_PATH: /v2025
        run: npm ci && npm run build:site
      - name: Assemble both versions
        run: |
          mkdir -p site/v2025
          cp -a current/dist/. site/
          cp -a archive/build/. site/v2025/
          touch site/.nojekyll
          test -f site/index.html
          test -f site/v2025/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy combined site
        id: deployment
        uses: actions/deploy-pages@v4
