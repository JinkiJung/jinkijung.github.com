<!DOCTYPE html><html><head><meta charset="utf-8"><title>Semantic colors</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
  <!-- LINK -->
  <div>
    <div style="height:48px;background:#d3e5ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:14px;color:#0070f3;font-weight:500;">Info pill</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <div style="width:20px;height:20px;background:#0070f3;border-radius:4px;"></div>
      <div style="width:20px;height:20px;background:#0761d1;border-radius:4px;"></div>
      <div style="width:20px;height:20px;background:#d3e5ff;border-radius:4px;"></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">link · success</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#0070f3 · #0761d1 · #d3e5ff</div>
  </div>
  <!-- ERROR -->
  <div>
    <div style="height:48px;background:#f7d4d6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:14px;color:#c50000;font-weight:500;">Error pill</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <div style="width:20px;height:20px;background:#ee0000;border-radius:4px;"></div>
      <div style="width:20px;height:20px;background:#c50000;border-radius:4px;"></div>
      <div style="width:20px;height:20px;background:#f7d4d6;border-radius:4px;"></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">error</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#ee0000 · #c50000 · #f7d4d6</div>
  </div>
  <!-- WARNING -->
  <div>
    <div style="height:48px;background:#ffefcf;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:14px;color:#ab570a;font-weight:500;">Warning pill</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <div style="width:20px;height:20px;background:#f5a623;border-radius:4px;"></div>
      <div style="width:20px;height:20px;background:#ab570a;border-radius:4px;"></div>
      <div style="width:20px;height:20px;background:#ffefcf;border-radius:4px;"></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">warning</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#f5a623 · #ab570a · #ffefcf</div>
  </div>
</div>
</body></html>
