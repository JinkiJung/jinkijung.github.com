<!DOCTYPE html><html><head><meta charset="utf-8"><title>Nav bar</title><link rel="stylesheet" href="_base.css"></head>
<body style="background:#fafafa;">
<div style="padding:0;">
  <div style="height:64px;background:#fff;box-shadow:inset 0 -1px 0 #ebebeb;display:flex;align-items:center;padding:0 24px;gap:24px;">
    <div style="font-family:var(--font-sans);font-weight:600;font-size:18px;letter-spacing:-0.6px;color:#171717;">jj.</div>
    <div style="display:flex;gap:4px;">
      <a style="font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#4d4d4d;padding:6px 10px;border-radius:6px;text-decoration:none;">Products</a>
      <a style="font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#4d4d4d;padding:6px 10px;border-radius:6px;text-decoration:none;">Solutions</a>
      <a style="font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#4d4d4d;padding:6px 10px;border-radius:6px;text-decoration:none;">Pricing</a>
      <a style="font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#4d4d4d;padding:6px 10px;border-radius:6px;text-decoration:none;">Docs</a>
      <a style="font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#4d4d4d;padding:6px 10px;border-radius:6px;text-decoration:none;">Blog</a>
    </div>
    <div style="flex:1;"></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button style="background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px #ebebeb;cursor:pointer;">Ask AI</button>
      <button style="background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;height:28px;padding:0 10px;border-radius:6px;cursor:pointer;">Log In</button>
      <button style="background:#171717;color:#fff;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;height:28px;padding:0 12px;border-radius:6px;cursor:pointer;">Sign Up</button>
    </div>
  </div>
  <div style="padding:14px 24px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-mute);">nav-bar · 64px tall · logo · link row · CTAs</div>
</div>
</body></html>
