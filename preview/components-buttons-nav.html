<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons — nav scale</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:14px;">
  <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-mute);">nav scale · 6px radius · 28px tall</div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button style="background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px #ebebeb;cursor:pointer;">Ask AI</button>
    <button style="background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;height:28px;padding:0 10px;border-radius:6px;cursor:pointer;">Log In</button>
    <button style="background:#171717;color:#fff;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;height:28px;padding:0 12px;border-radius:6px;cursor:pointer;">Sign Up</button>
    <div style="width:1px;height:24px;background:#ebebeb;margin:0 4px;"></div>
    <button style="width:28px;height:28px;background:#fff;border:none;border-radius:9999px;box-shadow:inset 0 0 0 1px #ebebeb;font-family:var(--font-sans);font-size:14px;color:#171717;cursor:pointer;">?</button>
  </div>
  <div style="font-family:var(--font-sans);font-size:13px;color:var(--color-body);">Sign-up · Log-in · Ask AI live in the nav at 28px tall with the 6px <code style="font-family:var(--font-mono);">--geist-radius</code> shape. Circular icon-button at right.</div>
</div>
</body></html>
