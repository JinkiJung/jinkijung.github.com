<!DOCTYPE html><html><head><meta charset="utf-8"><title>Elevation ladder</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:32px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;background:#fafafa;">
  <div style="text-align:center;">
    <div style="height:80px;background:#fff;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:8px;">1 · hairline</div>
  </div>
  <div style="text-align:center;">
    <div style="height:80px;background:#fff;border-radius:8px;box-shadow:0px 1px 1px rgba(0,0,0,0.02), 0px 2px 2px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:8px;">2 · subtle</div>
  </div>
  <div style="text-align:center;">
    <div style="height:80px;background:#fff;border-radius:8px;box-shadow:0px 2px 2px rgba(0,0,0,0.04), 0px 8px 8px -8px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:8px;">3 · soft stack</div>
  </div>
  <div style="text-align:center;">
    <div style="height:80px;background:#fff;border-radius:8px;box-shadow:0px 2px 2px rgba(0,0,0,0.04), 0px 8px 16px -4px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:8px;">4 · float</div>
  </div>
  <div style="text-align:center;">
    <div style="height:80px;background:#fff;border-radius:8px;box-shadow:0px 1px 1px rgba(0,0,0,0.02), 0px 8px 16px -4px rgba(0,0,0,0.04), 0px 24px 32px -8px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:8px;">5 · modal</div>
  </div>
</div>
</body></html>
