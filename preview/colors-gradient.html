<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brand mesh gradient</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:16px;">
  <div style="position:relative;height:280px;border-radius:12px;overflow:hidden;background:#fafafa;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);">
    <div style="position:absolute;inset:0;background:
      radial-gradient(60% 80% at 15% 20%, rgba(0,124,240,0.55), transparent 60%),
      radial-gradient(55% 70% at 80% 10%, rgba(0,223,216,0.50), transparent 60%),
      radial-gradient(70% 90% at 30% 90%, rgba(121,40,202,0.50), transparent 60%),
      radial-gradient(65% 80% at 90% 75%, rgba(255,0,128,0.45), transparent 60%),
      radial-gradient(70% 90% at 50% 50%, rgba(255,77,77,0.30), transparent 60%),
      radial-gradient(55% 75% at 65% 95%, rgba(249,203,40,0.40), transparent 60%);"></div>
    <div style="position:absolute;left:24px;bottom:20px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#fff;background:rgba(0,0,0,0.35);padding:4px 8px;border-radius:4px;backdrop-filter:blur(4px);">mesh · hero scale only</div>
    <div style="position:absolute;right:24px;top:20px;display:flex;gap:6px;">
      <div title="#007cf0" style="width:16px;height:16px;background:#007cf0;border-radius:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.6);"></div>
      <div title="#00dfd8" style="width:16px;height:16px;background:#00dfd8;border-radius:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.6);"></div>
      <div title="#7928ca" style="width:16px;height:16px;background:#7928ca;border-radius:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.6);"></div>
      <div title="#ff0080" style="width:16px;height:16px;background:#ff0080;border-radius:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.6);"></div>
      <div title="#ff4d4d" style="width:16px;height:16px;background:#ff4d4d;border-radius:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.6);"></div>
      <div title="#f9cb28" style="width:16px;height:16px;background:#f9cb28;border-radius:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.6);"></div>
    </div>
  </div>
</div>
</body></html>
