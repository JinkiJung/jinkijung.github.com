<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주인공 픽셀 아트 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#172521;color:#e4eee7;font:15px system-ui;padding:36px}main{max-width:760px;margin:auto}h1{font-size:25px}p{color:#9eb9aa;line-height:1.7}.cards{display:flex;gap:20px;flex-wrap:wrap}.card{flex:1;min-width:250px;background:#314b40;border:1px solid #587568;border-radius:12px;text-align:center;padding:22px}.sprite{display:block;width:192px;height:192px;margin:auto;image-rendering:pixelated}.small{width:48px;height:48px}button{background:#c1e4cc;border:0;border-radius:7px;padding:10px 18px;color:#172521;cursor:pointer;margin:16px 0}.paused .run{animation-play-state:paused}h2{font-size:15px}.caption{font-size:12px}
</style><main><h1>검은 머리 · 탑다운 픽셀 캐릭터</h1><p>한 방향의 동일한 캐릭터. 서 있는 자세와 양쪽 다리를 앞뒤로 번갈아 내딛는 달리기 시안입니다.</p><button id="toggle" aria-pressed="false">애니메이션 멈추기</button><div class="cards"><section class="card"><h2>서 있기</h2><canvas width="32" height="32" class="sprite" role="img" aria-label="정수리가 보이는 검은 머리 남자, 정지 자세"></canvas><canvas width="32" height="32" class="sprite small"></canvas></section><section class="card"><h2>달리기 · 4프레임 반복</h2><canvas width="32" height="32" class="sprite run" role="img" aria-label="양쪽 다리가 앞뒤로 움직이는 4프레임 달리기"></canvas><canvas width="32" height="32" class="sprite small run"></canvas></section></div><p class="caption">32×32 해상도 · 확대 보기와 실제 게임 크기 비교 · 게임과 동일한 머리 정렬 기준</p></main><script type="module">
const image=new Image();image.src='../images/game/player-sheet.png';
const [,layout]=await Promise.all([image.decode(),fetch('../images/game/player-frames.json').then(r=>r.json())]);
for(const canvas of document.querySelectorAll('canvas')){canvas.width=canvas.height=layout.rasterSize;if(canvas.classList.contains('small'))canvas.style.width=canvas.style.height=`${layout.displaySize}px`;}
let paused=false,elapsed=0,last=performance.now();
const button=document.querySelector('#toggle');
button.onclick=()=>{paused=!paused;button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'애니메이션 재생':'애니메이션 멈추기';};
function tick(now){if(!paused)elapsed+=(now-last)/1000;last=now;
for(const canvas of document.querySelectorAll('canvas')){
 const index=canvas.classList.contains('run')?1+Math.floor(elapsed/.12)%4:0;
 const [x,y]=layout.centers[index],size=layout.cropSize,ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,layout.rasterSize,layout.rasterSize);ctx.imageSmoothingEnabled=false;
 ctx.drawImage(image,(x-size/2)*image.width/layout.width,(y-size/2)*image.height/layout.height,size*image.width/layout.width,size*image.height/layout.height,0,0,layout.rasterSize,layout.rasterSize);
}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
