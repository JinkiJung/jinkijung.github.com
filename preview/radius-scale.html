<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radius scale</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-wrap:wrap;gap:16px;">
  <div style="text-align:center;">
    <div style="width:72px;height:72px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:0;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">none · 0</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:72px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:4px;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">xs · 4</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:72px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:6px;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">sm · 6</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:72px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:8px;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">md · 8</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:72px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:12px;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">lg · 12</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:72px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:16px;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">xl · 16</div>
  </div>
  <div style="text-align:center;">
    <div style="width:140px;height:48px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);border-radius:64px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:14px;color:#171717;">AI Apps</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">pill-sm · 64</div>
  </div>
  <div style="text-align:center;">
    <div style="width:140px;height:48px;background:#171717;border-radius:100px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:16px;font-weight:500;color:#fff;">Start Deploying</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-ink);margin-top:6px;">pill · 100 (marketing CTA)</div>
  </div>
</div>
</body></html>
