<!DOCTYPE html><html><head><meta charset="utf-8"><title>Surface ladder</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;">
    <div>
      <div style="height:96px;background:#ffffff;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
      <div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;color:var(--color-ink);">canvas</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#ffffff</div>
    </div>
    <div>
      <div style="height:96px;background:#fafafa;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
      <div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;color:var(--color-ink);">canvas-soft</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#fafafa</div>
    </div>
    <div>
      <div style="height:96px;background:#f5f5f5;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);"></div>
      <div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;color:var(--color-ink);">canvas-soft-2</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#f5f5f5</div>
    </div>
    <div>
      <div style="height:96px;background:#ebebeb;border-radius:8px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;color:var(--color-ink);">hairline</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#ebebeb</div>
    </div>
    <div>
      <div style="height:96px;background:#171717;border-radius:8px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;color:var(--color-ink);">primary</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">#171717</div>
    </div>
  </div>
</div>
</body></html>
