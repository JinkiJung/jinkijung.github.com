<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons — marketing</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:14px;">
  <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-mute);">marketing scale · 100px pill · 48px tall</div>
  <div style="display:flex;gap:12px;align-items:center;">
    <button style="background:#171717;color:#fff;border:none;font-family:var(--font-sans);font-size:16px;font-weight:500;height:48px;padding:0 22px;border-radius:100px;cursor:pointer;">Start Deploying</button>
    <button style="background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:16px;font-weight:500;height:48px;padding:0 22px;border-radius:100px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);cursor:pointer;">Get a Demo</button>
    <button style="background:#171717;color:#fff;border:none;font-family:var(--font-sans);font-size:16px;font-weight:500;height:48px;padding:0 22px;border-radius:100px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;">Start Deploying <span style="font-family:var(--font-mono);">→</span></button>
  </div>
  <div style="font-family:var(--font-sans);font-size:13px;color:var(--color-body);">Black-ink primary + white secondary. One pill scale per screen — never mix with the 6px nav radius.</div>
</div>
</body></html>
