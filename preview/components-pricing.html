<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pricing cards</title><link rel="stylesheet" href="_base.css"></head>
<body style="background:#fafafa;">
<div style="padding:24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
  <div style="background:#fff;border-radius:12px;padding:24px;box-shadow:0px 2px 2px rgba(0,0,0,0.04), 0px 8px 16px -4px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.08);">
    <div style="font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:-0.6px;color:#171717;">Hobby</div>
    <div style="font-family:var(--font-sans);font-size:36px;font-weight:600;letter-spacing:-1.8px;color:#171717;margin-top:8px;line-height:1;">$0</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:#4d4d4d;margin-top:4px;">free forever</div>
    <button style="margin-top:18px;width:100%;background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;height:36px;border-radius:100px;box-shadow:inset 0 0 0 1px #ebebeb;cursor:pointer;">Get started</button>
  </div>
  <div style="background:#171717;border-radius:12px;padding:24px;box-shadow:0px 2px 2px rgba(0,0,0,0.04), 0px 8px 16px -4px rgba(0,0,0,0.04);">
    <div style="font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:-0.6px;color:#fff;">Pro</div>
    <div style="font-family:var(--font-sans);font-size:36px;font-weight:600;letter-spacing:-1.8px;color:#fff;margin-top:8px;line-height:1;">$20</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:#a1a1a1;margin-top:4px;">per user / month</div>
    <button style="margin-top:18px;width:100%;background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;height:36px;border-radius:100px;cursor:pointer;">Start Pro</button>
  </div>
  <div style="background:#fff;border-radius:12px;padding:24px;box-shadow:0px 2px 2px rgba(0,0,0,0.04), 0px 8px 16px -4px rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.08);">
    <div style="font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:-0.6px;color:#171717;">Enterprise</div>
    <div style="font-family:var(--font-sans);font-size:36px;font-weight:600;letter-spacing:-1.8px;color:#171717;margin-top:8px;line-height:1;">Talk.</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:#4d4d4d;margin-top:4px;">custom contract</div>
    <button style="margin-top:18px;width:100%;background:#fff;color:#171717;border:none;font-family:var(--font-sans);font-size:14px;font-weight:500;height:36px;border-radius:100px;box-shadow:inset 0 0 0 1px #ebebeb;cursor:pointer;">Contact sales</button>
  </div>
</div>
</body></html>
