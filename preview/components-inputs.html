<!DOCTYPE html><html><head><meta charset="utf-8"><title>Form inputs</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:10px;max-width:520px;">
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.28px;color:#171717;">Email</div>
    <input type="text" placeholder="you@example.com" style="height:40px;padding:0 12px;border:none;border-radius:6px;box-shadow:inset 0 0 0 1px #ebebeb;font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#171717;background:#fff;outline:none;"/>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">form-input · 40px · 6px radius</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <input type="text" placeholder="Search…" style="height:32px;padding:0 12px;border:none;border-radius:6px;box-shadow:inset 0 0 0 1px #ebebeb;font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;color:#171717;background:#fff;outline:none;"/>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">form-input-sm · 32px</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;gap:8px;">
      <input type="text" placeholder="Subscribe with your email" style="flex:1;height:48px;padding:0 16px;border:none;border-radius:6px;box-shadow:inset 0 0 0 1px #ebebeb;font-family:var(--font-sans);font-size:16px;color:#171717;background:#fff;outline:none;"/>
      <button style="background:#171717;color:#fff;border:none;font-family:var(--font-sans);font-size:16px;font-weight:500;height:48px;padding:0 22px;border-radius:6px;cursor:pointer;">Subscribe</button>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">form-input-lg · 48px · hero CTAs</div>
  </div>
</div>
</body></html>
