<!DOCTYPE html><html><head><meta charset="utf-8"><title>Badges & banners</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:14px;">
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <span style="background:#fafafa;color:#4d4d4d;font-family:var(--font-sans);font-size:12px;padding:2px 10px;border-radius:9999px;box-shadow:inset 0 0 0 1px #ebebeb;">New</span>
    <span style="background:#fafafa;color:#4d4d4d;font-family:var(--font-sans);font-size:12px;padding:2px 10px;border-radius:9999px;box-shadow:inset 0 0 0 1px #ebebeb;">Beta</span>
    <span style="background:#fafafa;color:#4d4d4d;font-family:var(--font-sans);font-size:12px;padding:2px 10px;border-radius:9999px;box-shadow:inset 0 0 0 1px #ebebeb;">Live</span>
    <span style="background:#d3e5ff;color:#0070f3;font-family:var(--font-sans);font-size:12px;font-weight:500;padding:2px 10px;border-radius:9999px;">Info</span>
    <span style="background:#f7d4d6;color:#c50000;font-family:var(--font-sans);font-size:12px;font-weight:500;padding:2px 10px;border-radius:9999px;">Error</span>
    <span style="background:#ffefcf;color:#ab570a;font-family:var(--font-sans);font-size:12px;font-weight:500;padding:2px 10px;border-radius:9999px;">Pending</span>
  </div>
  <div style="display:inline-flex;align-items:center;gap:8px;background:#fafafa;color:#4d4d4d;font-family:var(--font-sans);font-size:14px;letter-spacing:-0.28px;padding:6px 14px;border-radius:9999px;box-shadow:inset 0 0 0 1px #ebebeb;width:max-content;">
    <span style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#171717;">WHAT'S NEW</span>
    <span style="width:1px;height:12px;background:#ebebeb;"></span>
    <span>Introducing AI SDK 5.0</span>
    <span style="font-family:var(--font-mono);">→</span>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-mute);">badge-secondary · banner-marketing</div>
</div>
</body></html>
