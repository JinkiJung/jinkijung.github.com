<!DOCTYPE html><html><head><meta charset="utf-8"><title>Display scale</title><link rel="stylesheet" href="_base.css"></head>
<body>
<div style="padding:24px;display:flex;flex-direction:column;gap:14px;">
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:48px;font-weight:600;letter-spacing:-2.4px;line-height:1;color:#171717;">Build and deploy.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">display-xl · 48/600/-2.4</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:32px;font-weight:600;letter-spacing:-1.28px;line-height:1;color:#171717;">Your frontend, delivered.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">display-lg · 32/600/-1.28</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:24px;font-weight:600;letter-spacing:-0.96px;line-height:1;color:#171717;">A compute model for all workloads.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">display-md · 24/600/-0.96</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;">
    <div style="font-family:var(--font-sans);font-size:20px;font-weight:600;letter-spacing:-0.6px;line-height:1;color:#171717;">Deploy your first app.</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--color-mute);">display-sm · 20/600/-0.6</div>
  </div>
</div>
</body></html>
